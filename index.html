<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="RexDex — ARK Creature Index for all story islands. Search dinos, view stats, diets, tame methods, and abilities.">
<meta name="keywords" content="ARK Survival Evolved, dino guide, creature reference, ARK dinos, tame guide">
<meta name="author" content="RexDex">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#16161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RexDex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="RexDex">
<meta name="msapplication-TileColor" content="#16161a">
<meta name="msapplication-navbutton-color" content="#16161a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 10 L90 80 H10 Z' fill='%23e8a020'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%2316161a'/%3E%3Cpath d='M90 40 L150 130 H30 Z' fill='%23e8a020'/%3E%3C/svg%3E">
<title>RexDex</title>
<style>
  :root {
    --bg: #16161a;
    --surface: #1f1f2e;
    --surface-soft: rgba(255,255,255,0.03);
    --border-chill: rgba(255,255,255,0.06);
    --text: #f0f0f5;
    --text-secondary: #c5c5d2;
    --text-muted: #9ca3af;
    --primary: #e8a020;
    --primary-glow: rgba(232,160,32,0.15);
    --accent2: #3ab8c8;
    --accent3: #ff6464;
    --green: #3aaa60;
    --purple: #b48cff;
    --white: #e8f0f4;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Source Sans 3', 'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    letter-spacing: 0.01em;
    word-spacing: 0.02em;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  h1, .hero-name {
    font-family: 'Lato', 'Source Sans 3', sans-serif;
  }

  .skip-link {
    position: absolute;
    top: -100px;
    left: 0;
    background: var(--primary);
    color: #16161a;
    padding: 12px 20px;
    font-weight: 700;
    font-size: 15px;
    border-radius: 0 0 8px 0;
    z-index: 10000;
    text-decoration: none;
    transition: top 0.2s ease;
  }
  .skip-link:focus {
    top: 0;
    position: fixed;
    outline: 3px solid #fff;
    outline-offset: 2px;
  }

  .container {
    max-width: 700px;
    margin: 0 auto;
    padding: 20px 14px;
    contain: layout style paint;
  }

  header {
    margin-bottom: 24px;
    text-align: center;
  }

  header h1 {
    font-size: 32px;
    font-weight: 700;
    margin: 0 0 8px 0;
    letter-spacing: -0.02em;
    color: var(--primary);
  }

  header h2 {
    color: var(--text-secondary);
    margin: 0 0 20px 0;
    font-size: 16px;
    font-weight: 400;
    font-family: inherit;
  }

  .controls-wrapper {
    display: flex;
    gap: 10px;
    max-width: 520px;
    margin: 0 auto 24px auto;
    flex-wrap: wrap;
    justify-content: center;
  }

  .search-input {
    flex: 1;
    min-width: 200px;
    min-height: 44px;
    background: var(--surface-soft);
    border: 1px solid var(--border-chill);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 22px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: all 0.2s ease;
  }

  .search-input:focus {
    border-color: var(--primary);
    background: var(--surface);
    box-shadow: 0 0 0 3px var(--primary-glow);
  }

  .search-input::placeholder { color: var(--text-muted); }

  .btn {
    background: var(--surface-soft);
    color: var(--text);
    border: 1px solid var(--border-chill);
    padding: 10px 20px;
    border-radius: 22px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    white-space: nowrap;
    min-height: 44px;
    min-width: 44px;
  }

  .btn:hover:not(:disabled) { background: rgba(255,255,255,0.06); }
  .btn-primary {
    background: var(--primary);
    color: #16161a;
    border-color: var(--primary);
  }
  .btn-primary:hover:not(:disabled) { opacity: 0.9; box-shadow: 0 4px 12px var(--primary-glow); }
  .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .status-message {
    padding: 12px 20px;
    border-radius: 20px;
    margin: 16px 0;
    display: none;
    font-size: 14px;
    text-align: center;
  }
  .status-loading { background: var(--surface-soft); color: var(--primary); }
  .status-error { background: rgba(200,64,64,0.1); color: var(--accent3); }
  .show { display: block; }

  #tabsHeader {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    overflow-x: auto;
    padding: 4px 0;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    justify-content: flex-start;
  }
  #tabsHeader::-webkit-scrollbar { display: none; }

  .tab-button {
    padding: 8px 14px;
    background: var(--surface-soft);
    border: 1px solid var(--border-chill);
    border-radius: 16px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    color: var(--text-secondary);
    font-weight: 500;
    white-space: nowrap;
    transition: all 0.2s ease;
    min-height: 36px;
    line-height: 1;
    flex-shrink: 0;
    -webkit-user-select: none;
    user-select: none;
  }

  .tab-button.active {
    background: var(--primary);
    color: #16161a;
    border-color: var(--primary);
    font-weight: 600;
    box-shadow: 0 4px 12px var(--primary-glow);
  }

  .tab-button:hover:not(.active) { background: rgba(255,255,255,0.06); }
  .tab-button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .filter-panel {
    margin-bottom: 16px;
    background: var(--surface-soft);
    border: 1px solid var(--border-chill);
    border-radius: 16px;
    overflow: hidden;
  }

  .filter-panel summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    font-family: inherit;
    list-style: none;
    min-height: 44px;
    -webkit-user-select: none;
    user-select: none;
    transition: background 0.15s ease;
  }

  .filter-panel summary::-webkit-details-marker { display: none; }

  .filter-panel summary:hover {
    background: rgba(255,255,255,0.05);
  }

  .filter-panel summary:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: -2px;
  }

  .filter-panel summary .summary-label {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .filter-panel summary .summary-label svg {
    flex-shrink: 0;
    display: block;
  }

  .filter-panel summary .summary-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    color: var(--text-muted);
    transition: transform 0.2s ease;
    flex-shrink: 0;
    margin-left: 12px;
  }
  .filter-panel summary .summary-icon svg {
    display: block;
  }

  .filter-panel[open] summary .summary-icon {
    transform: rotate(180deg);
  }

  .filter-panel .filter-body {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 10px 16px 16px;
  }

  .filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    min-height: 28px;
  }

  .filter-label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    min-width: 42px;
    flex-shrink: 0;
    line-height: 28px;
  }

  .filter-chip {
    appearance: none;
    -webkit-appearance: none;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
    min-height: 28px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
    white-space: nowrap;
  }

  .filter-chip:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.18);
    color: var(--text);
  }

  .filter-chip:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  .filter-chip[aria-pressed="true"] {
    background: var(--primary);
    color: #16161a;
    border-color: var(--primary);
    font-weight: 600;
  }
  .filter-chip[aria-pressed="true"]:hover {
    background: #d99010;
    border-color: #d99010;
  }

  .dino-list {
    display: flex;
    flex-direction: column;
  }

  .dino-item {
    padding: 16px 0;
    border-bottom: 1px solid var(--border-chill);
    cursor: pointer;
    transition: opacity 0.2s ease;
    min-height: 48px;
  }

  .dino-item:last-child { border-bottom: none; }
  .dino-item:hover { opacity: 0.8; }
  .dino-item:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; }

  .dino-item .dino-name {
    font-family: 'Lato', 'Source Sans 3', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: +0.02em;
    margin-bottom: 6px;
  }

  .dino-item .dino-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }

  .dino-item .dino-desc {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  .tag {
    display: inline-block;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }

  .tag-herb { background: rgba(58,170,96,0.15); color: var(--green); border: 1px solid rgba(58,170,96,0.3); }
  .tag-carn { background: rgba(255,100,100,0.15); color: var(--accent3); border: 1px solid rgba(255,100,100,0.3); }
  .tag-omni { background: rgba(180,140,255,0.15); color: var(--purple); border: 1px solid rgba(180,140,255,0.3); }
  .tag-passive { background: rgba(58,184,200,0.15); color: var(--accent2); border: 1px solid rgba(58,184,200,0.3); }
  .tag-ko { background: rgba(232,160,32,0.15); color: var(--primary); border: 1px solid rgba(232,160,32,0.3); }
  .tag-ride { background: rgba(200,200,200,0.1); color: var(--white); border: 1px solid rgba(200,200,200,0.2); }
  .tag-noride { background: rgba(90,106,116,0.15); color: var(--text-muted); border: 1px solid rgba(90,106,116,0.3); }
  .tag-info { background: rgba(232,160,32,0.15); color: var(--primary); border: 1px solid rgba(232,160,32,0.3); }
  .tag-mineral { background: rgba(58,184,200,0.15); color: var(--accent2); border: 1px solid rgba(58,184,200,0.3); }
  .tag-special { background: rgba(180,140,255,0.15); color: var(--purple); border: 1px solid rgba(180,140,255,0.3); }

  .detail-view {
    display: none;
    animation: fadeIn 0.3s ease;
  }
  .detail-view.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .detail-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-chill);
  }

  .detail-back {
    background: var(--surface-soft);
    border: 1px solid var(--border-chill);
    color: var(--text-secondary);
    padding: 8px 14px;
    border-radius: 16px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s ease;
    min-height: 40px;
    min-width: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .detail-back:hover { background: rgba(255,255,255,0.06); color: var(--white); }
  .detail-back:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .detail-star {
    background: var(--surface-soft);
    border: 1px solid var(--border-chill);
    color: var(--primary);
    padding: 8px 12px;
    border-radius: 16px;
    cursor: pointer;
    font-family: inherit;
    font-size: 18px;
    line-height: 1;
    font-weight: 600;
    transition: all 0.2s ease;
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    min-width: 40px;
  }
  .detail-star:hover { background: rgba(255,255,255,0.06); }
  .detail-star:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .hero-name {
    font-size: 36px;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--primary);
  }
  @media (min-width: 480px) {
    .hero-name { font-size: 48px; letter-spacing: -0.03em; }
  }

  .hero-meta {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 8px;
  }

  .hero-meta .divider {
    color: var(--text-muted);
    margin: 0 8px;
  }

  .block {
    padding: 20px 0;
    border-bottom: 1px solid var(--border-chill);
  }
  .block:last-child { border-bottom: none; }

  .block-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 16px;
    font-weight: 600;
  }

  .data-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-chill);
  }
  .data-row:last-child { border-bottom: none; }

  .data-row .label {
    font-size: 14px;
    color: var(--text-secondary);
  }

  .data-row .value {
    font-size: 14px;
    color: var(--text);
    font-weight: 600;
  }

  .data-row .value .at {
    color: var(--text-muted);
    font-weight: 400;
  }

  .detail-desc {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
  }

  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .search-results-header {
    margin-bottom: 20px;
    font-size: 16px;
    color: var(--text-secondary);
    text-align: center;
  }
  .search-results-header.no-results { color: var(--accent3); }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  html.is-tv { font-size: 18px; }
  html.is-tv body { padding: 48px 5%; }
  html.is-tv .container { max-width: 960px; }
  html.is-tv header h1 { font-size: 48px; }
  html.is-tv .hero-name { font-size: 64px; }
  html.is-tv .dino-item .dino-name { font-size: 26px; }
  html.is-tv :focus-visible {
    outline: 4px solid var(--primary);
    outline-offset: 6px;
    box-shadow: 0 0 0 10px var(--primary-glow);
  }

  @media print {
    body { background: #fff; color: #000; }
    .dino-item { border-bottom: 1px solid #ccc; }
    .tab-button, .search-input, .btn, .detail-back, .detail-star, .filter-chip { display: none; }
    .tab-content { display: block !important; }
    .detail-view { display: block !important; }
  }
</style>

<script>
(function() {
  var redirect = sessionStorage.getItem('ghp_redirect');
  if (redirect) {
    sessionStorage.removeItem('ghp_redirect');
    if (redirect !== location.href) {
      history.replaceState(null, null, redirect);
    }
  }
})();
</script>
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>
<div class="container">
  <header>
    <h1>RexDex</h1>
    <h2>ARK Creature Index — all story islands, all dinos</h2>
    <div class="controls-wrapper">
      <input type="text" id="searchInput" class="search-input" placeholder="Search dinos by name..." aria-label="Search dinos" autocomplete="off" enterkeyhint="search">
      <button type="button" class="btn btn-primary" id="searchBtn" aria-label="Search dinos">
        <span class="sr-only">Search</span>
        <span aria-hidden="true">Search</span>
      </button>
    </div>
    <div id="statusMessage" class="status-message" role="status" aria-live="polite" aria-atomic="true"></div>
  </header>

  <main id="main">
    <nav id="tabsHeader" role="tablist" aria-label="ARK story islands"></nav>
    <div id="tabsContent"></div>
    <div id="searchView" class="tab-content" style="display:none;">
      <div id="searchResultsHeader" class="search-results-header"></div>
      <div id="searchResultsList" class="dino-list"></div>
    </div>
    <div id="detailView" class="detail-view"></div>
  </main>
</div>

<script>
(function() {
  'use strict';

  const DINOS = {
    'The Island': [
      {name:'Achatina',diet:'Herbivore',tame:'Passive',ride:'No',desc:'Giant snail that generates Cementing Paste and Organic Polymer over time. Keep in a secure pen.',tameTips:'Passive tame with Sweet Vegetable Cake. Damage it slightly first so it will eat. Keep in a secure pen.',health:75,stamina:100,oxygen:10,food:10,weight:150,torpor:50},
      {name:'Allosaurus',diet:'Carnivore',tame:'Knockout',ride:'Yes',desc:'Pack hunter with bleed attack. Alpha gains damage buff. Excellent for cave runs and meat harvesting.',tameTips:'Knockout with tranq darts. Build a trap — they travel in packs and the alpha deals extra damage. Superior Kibble or Raw Mutton.',health:630,stamina:250,oxygen:25,food:10,weight:150,torpor:15},
      {name:'Ammonite',diet:'None',tame:'None',ride:'No',desc:'Cannot be tamed. Releases pheromone cloud when attacked that aggros all nearby creatures.',health:165,stamina:100,oxygen:10,food:10,weight:150,torpor:15},
      {name:'Anglerfish',diet:'Carnivore',tame:'Knockout',ride:'Yes',desc:'Deep sea fish that gathers Angler Gel and Silica Pearls. Produces light with its lure.',tameTips:'Knockout underwater with Crossbow or Harpoon Launcher. It flees when damaged — trap it in a small cave.',health:450,stamina:240,oxygen:24,food:10,weight:150,torpor:15},
      {name:'Ankylosaurus',diet:'Herbivore',tame:'Knockout',ride:'Yes',desc:'Best metal, crystal, and oil gatherer in the game. Essential for any tribe. High weight reduction on metal.',tameTips:'Knockout with tranq darts. High torpor pool — bring plenty of narcotics. Regular Kibble or crops.',health:700,stamina:175,oxygen:17.5,food:10,weight:150,torpor:15},
      {name:'Araneo',diet:'Carnivore',tame:'Knockout',ride:'Yes',desc:'Giant spider that can climb walls and ceilings. Web attack slows enemies. Can enter most caves.',tameTips:'Knockout in a cave with spoiled meat. Must be inside a cave to be tameable. Low torpor, go easy on hits.',health:150,stamina:100,oxygen:10,food:10,weight:150,torpor:15},
      {name:'Archaeopteryx',diet:'Herbivore',tame:'Passive',ride:'No',desc:'Living parachute. Glides when dropped. Gathers Tree Sap from Redwood trees when set to wander.',tameTips:'Passive tame with Chitin. Must be carried to a Redwood tree and dropped near it. Use Ghillie — very skittish.',health:125,stamina:150,oxygen:15,food:10,weight:150,torpor:15},

  const ISLANDS = Object.keys(DINOS);
  let currentIsland = ISLANDS[0];
  let currentDino = null;
  let cameFromSearch = false;
  let cameFromTracker = false;
  let ignoreNextHashChange = false;

  const TRACKER_KEY = 'rexdex_tracker';
  const MAX_TRACKED = 30;

  // Per-island filter state
  const FILTER_STATE = {};
  ISLANDS.forEach(function(island) {
    FILTER_STATE[island] = { diet: 'All', tame: 'All', ride: 'All' };
  });

  const DIET_OPTIONS = ['All','Herbivore','Carnivore','Omnivore','Mineral','None'];
  const TAME_OPTIONS = ['All','Passive','Knockout','Special','Craft','Hack','None'];
  const RIDE_OPTIONS = ['All','Yes','No'];

  const getElement = function(id) { return document.getElementById(id); };
  const tabsHeader = getElement('tabsHeader');
  const tabsContent = getElement('tabsContent');
  const detailView = getElement('detailView');
  const searchView = getElement('searchView');
  const searchInput = getElement('searchInput');
  const searchBtn = getElement('searchBtn');
  const statusEl = getElement('statusMessage');

  function showStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = 'status-message show status-' + type;
  }

  function clearStatus() {
    statusEl.classList.remove('show');
    statusEl.textContent = '';
  }

  function updateSearchButton() {
    if (searchInput.value.trim()) {
      searchBtn.querySelector('span[aria-hidden]').textContent = 'Clear';
      searchBtn.setAttribute('aria-label', 'Clear search');
      searchBtn.onclick = function() {
        searchInput.value = '';
        searchInput.focus();
        performSearch('');
      };
    } else {
      searchBtn.querySelector('span[aria-hidden]').textContent = 'Search';
      searchBtn.setAttribute('aria-label', 'Search dinos');
      searchBtn.onclick = window.handleSearch;
    }
  }

  function setHash(hash) {
    ignoreNextHashChange = true;
    if (hash) {
      location.hash = '#' + hash;
    } else {
      location.hash = '';
    }
    setTimeout(function() { ignoreNextHashChange = false; }, 50);
  }

  function showIslandView() {
    searchView.style.display = 'none';
    detailView.classList.remove('active');
    detailView.innerHTML = '';
    tabsContent.style.display = 'block';
    tabsHeader.style.display = 'flex';
    clearStatus();
    cameFromSearch = false;
    cameFromTracker = false;
  }

  function showSearchView(results, query) {
    tabsContent.style.display = 'none';
    tabsHeader.style.display = 'none';
    detailView.classList.remove('active');
    detailView.innerHTML = '';
    searchView.style.display = 'block';

    const header = getElement('searchResultsHeader');
    const list = getElement('searchResultsList');

    if (results.length === 0) {
      header.textContent = 'No dinos found matching "' + query + '"';
      header.classList.add('no-results');
    } else {
      header.textContent = 'Found ' + results.length + ' result' + (results.length !== 1 ? 's' : '') + ' for "' + query + '"';
      header.classList.remove('no-results');
    }
    list.innerHTML = '';
    results.forEach(function(result) {
      const item = document.createElement('div');
      item.className = 'dino-item';
      item.setAttribute('tabindex', '0');
      item.setAttribute('role', 'button');
      item.setAttribute('aria-label', result.dino.name + ', ' + result.dino.diet + ', ' + result.dino.tame + ' tame');
      item.innerHTML =
        '<div class="dino-name">' + result.dino.name + '</div>' +
        '<div class="dino-meta">' +
          getDietTag(result.dino.diet) +
          '<span class="tag tag-info">' + result.island + '</span>' +
        '</div>' +
        '<div class="dino-desc">' + result.dino.desc + '</div>';

      item.onclick = function() {
        cameFromSearch = true;
        cameFromTracker = false;
        currentIsland = result.island;
        showDinoDetail(result.dino);
      };
      item.onkeydown = function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          cameFromSearch = true;
          cameFromTracker = false;
          currentIsland = result.island;
          showDinoDetail(result.dino);
        }
      };
      list.appendChild(item);
    });
  }

  function performSearch(query) {
    if (!query) {
      showIslandView();
      const buttons = tabsHeader.querySelectorAll('.tab-button');
      const panels = tabsContent.querySelectorAll('.tab-content');
      buttons.forEach(function(btn, idx) {
        const active = idx < ISLANDS.length && ISLANDS[idx] === currentIsland;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-selected', active ? 'true' : 'false');
        btn.setAttribute('tabindex', active ? '0' : '-1');
      });
      panels.forEach(function(panel, idx) {
        const active = idx < ISLANDS.length && ISLANDS[idx] === currentIsland;
        panel.classList.toggle('active', active);
        if (active && idx < ISLANDS.length) {
          renderDinoList(panel, DINOS[currentIsland]);
          renderFilters(panel, currentIsland);
        }
      });
      setHash(encodeURIComponent(currentIsland));
      updateSearchButton();
      return;
    }

    let found = [];
    ISLANDS.forEach(function(island) {
      DINOS[island].forEach(function(dino) {
        if (dino.name.toLowerCase().includes(query)) {
          found.push({island: island, dino: dino});
        }
      });
    });

    showSearchView(found, query);
    setHash('search=' + encodeURIComponent(query));
    updateSearchButton();
  }

  function getTrackedList() {
    try {
      var data = JSON.parse(localStorage.getItem(TRACKER_KEY));
      return Array.isArray(data) ? data : [];
    } catch(e) { return []; }
  }

  function saveTrackedList(list) {
    localStorage.setItem(TRACKER_KEY, JSON.stringify(list.slice(0, MAX_TRACKED)));
  }

  function isTracked(dinoName, islandName) {
    return getTrackedList().some(function(item) {
      return item.name === dinoName && item.island === islandName;
    });
  }

  window.toggleTrackDino = function() {
    if (!currentDino) return;
    var dino = currentDino;
    var island = currentIsland;
    var list = getTrackedList();
    var idx = list.findIndex(function(item) { return item.name === dino.name && item.island === island; });

    if (idx >= 0) {
      list.splice(idx, 1);
      showStatus('Removed ' + dino.name + ' from tracker', 'loading');
    } else {
      if (list.length >= MAX_TRACKED) {
        showStatus('Tracker full (max 30 dinos)', 'error');
        return;
      }
      list.push({name: dino.name, island: island});
      showStatus('Added ' + dino.name + ' to tracker', 'loading');
    }
    saveTrackedList(list);
    _showDinoDetail(dino);
    var trackerPanel = getElement('tabpanel-tracker');
    if (trackerPanel && trackerPanel.classList.contains('active')) {
      renderTrackerList(trackerPanel);
    }
  };

  function renderTrackerList(container) {
    container.innerHTML = '';
    var list = document.createElement('div');
    list.className = 'dino-list';

    var tracked = getTrackedList();

    if (tracked.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'dino-item';
      empty.style.cursor = 'default';
      empty.style.opacity = '0.6';
      empty.innerHTML = '<div class="dino-desc" style="text-align:center;padding:40px 0;">No dinosaurs tracked yet.<br>Visit a dino page and tap the star to track it.</div>';
      list.appendChild(empty);
      container.appendChild(list);
      return;
    }

    tracked.forEach(function(item) {
      var island = item.island;
      var dinoList = DINOS[island];
      if (!dinoList) return;
      var dino = dinoList.find(function(d) { return d.name === item.name; });
      if (!dino) return;

      var dinoItem = document.createElement('div');
      dinoItem.className = 'dino-item';
      dinoItem.setAttribute('tabindex', '0');
      dinoItem.setAttribute('role', 'button');
      dinoItem.setAttribute('aria-label', dino.name + ', ' + dino.diet + ', ' + dino.tame + ' tame');
      dinoItem.innerHTML =
        '<div class="dino-name">' + dino.name + '</div>' +
        '<div class="dino-meta">' +
          getDietTag(dino.diet) +
          getTameTag(dino.tame) +
          getRideTag(dino.ride) +
          '<span class="tag tag-info">' + island + '</span>' +
        '</div>' +
        '<div class="dino-desc">' + dino.desc + '</div>';

      dinoItem.onclick = function() {
        cameFromSearch = false;
        cameFromTracker = true;
        currentIsland = island;
        showDinoDetail(dino);
      };
      dinoItem.onkeydown = function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          cameFromSearch = false;
          cameFromTracker = true;
          currentIsland = island;
          showDinoDetail(dino);
        }
      };
      list.appendChild(dinoItem);
    });

    container.appendChild(list);
  }

  function renderFilters(container, island) {
    var existing = container.querySelector('.filter-panel');
    if (existing) existing.remove();

    // Count active filters for the summary badge
    var activeCount = 0;
    if (FILTER_STATE[island].diet !== 'All') activeCount++;
    if (FILTER_STATE[island].tame !== 'All') activeCount++;
    if (FILTER_STATE[island].ride !== 'All') activeCount++;

    var details = document.createElement('details');
    details.className = 'filter-panel';

    // Build summary using DOM methods to ensure proper parsing
    var summary = document.createElement('summary');

    var labelSpan = document.createElement('span');
    labelSpan.className = 'summary-label';
    labelSpan.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg> Filters' + (activeCount > 0 ? ' <span style="color:var(--primary);">(' + activeCount + ')</span>' : '');

    var iconSpan = document.createElement('span');
    iconSpan.className = 'summary-icon';
    iconSpan.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

    summary.appendChild(labelSpan);
    summary.appendChild(iconSpan);

    var body = document.createElement('div');
    body.className = 'filter-body';
    body.setAttribute('role', 'group');
    body.setAttribute('aria-label', 'Filter dinos for ' + island);

    function makeGroup(label, options, category) {
      var group = document.createElement('div');
      group.className = 'filter-row';
      var lbl = document.createElement('span');
      lbl.className = 'filter-label';
      lbl.textContent = label;
      group.appendChild(lbl);
      options.forEach(function(opt) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'filter-chip';
        btn.textContent = opt;
        btn.setAttribute('aria-pressed', FILTER_STATE[island][category] === opt ? 'true' : 'false');
        btn.onclick = function() {
          FILTER_STATE[island][category] = opt;
          renderFilters(container, island);
          renderDinoList(container, DINOS[island]);
        };
        group.appendChild(btn);
      });
      return group;
    }

    body.appendChild(makeGroup('Diet', DIET_OPTIONS, 'diet'));
    body.appendChild(makeGroup('Tame', TAME_OPTIONS, 'tame'));
    body.appendChild(makeGroup('Ride', RIDE_OPTIONS, 'ride'));

    details.appendChild(summary);
    details.appendChild(body);
    container.insertBefore(details, container.firstChild);
  }

  function renderTabs() {
    tabsHeader.innerHTML = '';
    tabsContent.innerHTML = '';

    ISLANDS.forEach(function(island, index) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tab-button' + (index === 0 ? ' active' : '');
      btn.setAttribute('role', 'tab');
      btn.setAttribute('aria-selected', index === 0 ? 'true' : 'false');
      btn.setAttribute('aria-controls', 'tabpanel-' + index);
      btn.setAttribute('tabindex', index === 0 ? '0' : '-1');
      btn.id = 'tab-' + index;
      btn.setAttribute('data-index', index);
      btn.textContent = island;
      btn.onclick = function() { switchTab(index); };
      tabsHeader.appendChild(btn);

      const panel = document.createElement('div');
      panel.className = 'tab-content' + (index === 0 ? ' active' : '');
      panel.id = 'tabpanel-' + index;
      panel.setAttribute('role', 'tabpanel');
      panel.setAttribute('aria-labelledby', 'tab-' + index);
      tabsContent.appendChild(panel);
    });

    var trackerBtn = document.createElement('button');
    trackerBtn.type = 'button';
    trackerBtn.className = 'tab-button';
    trackerBtn.setAttribute('role', 'tab');
    trackerBtn.setAttribute('aria-selected', 'false');
    trackerBtn.setAttribute('aria-controls', 'tabpanel-tracker');
    trackerBtn.setAttribute('tabindex', '-1');
    trackerBtn.id = 'tab-tracker';
    trackerBtn.textContent = 'Tracker';
    trackerBtn.onclick = function() { switchTab(ISLANDS.length); };
    tabsHeader.appendChild(trackerBtn);

    var trackerPanel = document.createElement('div');
    trackerPanel.className = 'tab-content';
    trackerPanel.id = 'tabpanel-tracker';
    trackerPanel.setAttribute('role', 'tabpanel');
    trackerPanel.setAttribute('aria-labelledby', 'tab-tracker');
    tabsContent.appendChild(trackerPanel);

    if (ISLANDS.length > 0) {
      renderFilters(tabsContent.firstElementChild, ISLANDS[0]);
      renderDinoList(tabsContent.firstElementChild, DINOS[ISLANDS[0]]);
    }
  }

  function _switchTab(index) {
    var buttons = tabsHeader.querySelectorAll('.tab-button');
    var panels = tabsContent.querySelectorAll('.tab-content');

    buttons.forEach(function(btn, idx) {
      var active = idx === index;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-selected', active ? 'true' : 'false');
      btn.setAttribute('tabindex', active ? '0' : '-1');
    });

    panels.forEach(function(panel, idx) {
      var active = idx === index;
      panel.classList.toggle('active', active);
      if (active) {
        if (idx < ISLANDS.length) {
          currentIsland = ISLANDS[idx];
          renderFilters(panel, currentIsland);
          renderDinoList(panel, DINOS[currentIsland]);
        } else {
          renderTrackerList(panel);
        }
      }
    });

    hideDetail();
  }

  function switchTab(index) {
    _switchTab(index);
    if (index < ISLANDS.length) {
      setHash(encodeURIComponent(ISLANDS[index]));
    } else {
      setHash('tracker');
    }
  }

  function getDietTag(diet) {
    if (diet === 'Herbivore') return '<span class="tag tag-herb">Herbivore</span>';
    if (diet === 'Carnivore') return '<span class="tag tag-carn">Carnivore</span>';
    if (diet === 'Omnivore') return '<span class="tag tag-omni">Omnivore</span>';
    if (diet === 'Mineral') return '<span class="tag tag-mineral">Mineral</span>';
    return '<span class="tag tag-noride">' + diet + '</span>';
  }

  function getTameTag(tame) {
    if (tame === 'Passive') return '<span class="tag tag-passive">Passive</span>';
    if (tame === 'Knockout') return '<span class="tag tag-ko">Knockout</span>';
    if (tame === 'Special') return '<span class="tag tag-special">Special</span>';
    if (tame === 'Craft') return '<span class="tag tag-special">Craft</span>';
    if (tame === 'Hack') return '<span class="tag tag-special">Hack</span>';
    return '<span class="tag tag-noride">' + tame + '</span>';
  }

  function getRideTag(ride) {
    if (ride === 'Yes') return '<span class="tag tag-ride">Rideable</span>';
    return '<span class="tag tag-noride">Not Rideable</span>';
  }

  function renderDinoList(container, dinoList) {
    // Remove existing dino-list if any (but keep filter-panel)
    var existing = container.querySelector('.dino-list');
    if (existing) existing.remove();

    var island = currentIsland;
    var filters = FILTER_STATE[island] || { diet: 'All', tame: 'All', ride: 'All' };

    var filtered = dinoList.filter(function(dino) {
      return (filters.diet === 'All' || dino.diet === filters.diet) &&
             (filters.tame === 'All' || dino.tame === filters.tame) &&
             (filters.ride === 'All' || dino.ride === filters.ride);
    });

    const list = document.createElement('div');
    list.className = 'dino-list';

    if (filtered.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'dino-item';
      empty.style.cursor = 'default';
      empty.style.opacity = '0.6';
      empty.innerHTML = '<div class="dino-desc" style="text-align:center;padding:40px 0;">No creatures match the selected filters.<br>Try adjusting the filter chips above.</div>';
      list.appendChild(empty);
      container.appendChild(list);
      return;
    }

    filtered.forEach(function(dino) {
      const item = document.createElement('div');
      item.className = 'dino-item';
      item.setAttribute('tabindex', '0');
      item.setAttribute('role', 'button');
      item.setAttribute('aria-label', dino.name + ', ' + dino.diet + ', ' + dino.tame + ' tame');
      item.innerHTML =
        '<div class="dino-name">' + dino.name + '</div>' +
        '<div class="dino-meta">' +
          getDietTag(dino.diet) +
          getTameTag(dino.tame) +
          getRideTag(dino.ride) +
        '</div>' +
        '<div class="dino-desc">' + dino.desc + '</div>';

      item.onclick = function() {
        cameFromSearch = false;
        cameFromTracker = false;
        showDinoDetail(dino);
      };
      item.onkeydown = function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          cameFromSearch = false;
          cameFromTracker = false;
          showDinoDetail(dino);
        }
      };
      list.appendChild(item);
    });

    container.appendChild(list);
  }

  function _showDinoDetail(dino) {
    currentDino = dino;
    tabsContent.style.display = 'none';
    tabsHeader.style.display = 'none';
    searchView.style.display = 'none';
    detailView.classList.add('active');

    var isStarred = isTracked(dino.name, currentIsland);
    var starLabel = isStarred ? 'Remove from tracker' : 'Add to tracker';
    var starChar = isStarred ? '★' : '☆';

    var tameBlock = '';
    if (dino.tameTips) {
      tameBlock =
        '<div class="block">' +
          '<h3 class="block-label">Taming Tips</h3>' +
          '<div class="detail-desc">' + dino.tameTips + '</div>' +
        '</div>';
    }

    detailView.innerHTML =
      '<div class="detail-header">' +
        '<button type="button" class="detail-back" onclick="window.goBack()" aria-label="Back to previous view">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="vertical-align:middle;margin-right:6px;">' +
            '<path d="M19 12H5M12 19l-7-7 7-7"/>' +
          '</svg>' +
          'Back' +
        '</button>' +
        '<button type="button" class="detail-star" onclick="window.toggleTrackDino()" aria-label="' + starLabel + '" aria-pressed="' + (isStarred ? 'true' : 'false') + '">' +
          '<span aria-hidden="true">' + starChar + '</span>' +
        '</button>' +
      '</div>' +

      '<div class="block" style="padding-top:0;">' +
        '<h2 class="hero-name">' + dino.name + '</h2>' +
        '<div class="hero-meta">' +
          '<span>' + getDietTag(dino.diet) + '</span>' +
          '<span class="divider">/</span>' +
          '<span>' + dino.tame + ' tame</span>' +
          '<span class="divider">/</span>' +
          '<span>' + currentIsland + '</span>' +
        '</div>' +
      '</div>' +

      '<div class="block">' +
        '<h3 class="block-label">Basic Info</h3>' +
        '<div class="data-row"><span class="label">Diet</span><span class="value">' + dino.diet + '</span></div>' +
        '<div class="data-row"><span class="label">Tame Method</span><span class="value">' + dino.tame + '</span></div>' +
        '<div class="data-row"><span class="label">Rideable</span><span class="value">' + dino.ride + '</span></div>' +
        '<div class="data-row"><span class="label">Found On</span><span class="value">' + currentIsland + '</span></div>' +
      '</div>' +

      '<div class="block">' +
        '<h3 class="block-label">Base Stats (Level 1)</h3>' +
        '<div class="data-row"><span class="label">Health</span><span class="value">' + (dino.health || '—') + '</span></div>' +
        '<div class="data-row"><span class="label">Stamina</span><span class="value">' + (dino.stamina || '—') + '</span></div>' +
        '<div class="data-row"><span class="label">Oxygen</span><span class="value">' + (dino.oxygen || '—') + '</span></div>' +
        '<div class="data-row"><span class="label">Food</span><span class="value">' + (dino.food || '—') + '</span></div>' +
        '<div class="data-row"><span class="label">Weight</span><span class="value">' + (dino.weight || '—') + '</span></div>' +
        '<div class="data-row"><span class="label">Torpor</span><span class="value">' + (dino.torpor || '—') + '</span></div>' +
      '</div>' +

      '<div class="block">' +
        '<h3 class="block-label">Tags</h3>' +
        '<div class="tag-row">' +
          getDietTag(dino.diet) +
          getTameTag(dino.tame) +
          getRideTag(dino.ride) +
        '</div>' +
      '</div>' +

      tameBlock +

      '<div class="block">' +
        '<h3 class="block-label">Description</h3>' +
        '<div class="detail-desc">' + dino.desc + '</div>' +
      '</div>';
  }

  function showDinoDetail(dino) {
    _showDinoDetail(dino);
    setHash(encodeURIComponent(currentIsland) + '/' + encodeURIComponent(dino.name));
  }

  window.goBack = function() {
    if (cameFromSearch && searchInput.value.trim()) {
      performSearch(searchInput.value.trim().toLowerCase());
    } else if (cameFromTracker) {
      _switchTab(ISLANDS.length);
      setHash('tracker');
    } else {
      showIslandView();
      setHash(encodeURIComponent(currentIsland));
    }
  };

  function hideDetail() {
    detailView.classList.remove('active');
    detailView.innerHTML = '';
    tabsContent.style.display = 'block';
    tabsHeader.style.display = 'flex';
    searchView.style.display = 'none';
    currentDino = null;
    cameFromSearch = false;
    cameFromTracker = false;
  }

  window.handleSearch = function() {
    const query = searchInput.value.trim().toLowerCase();
    performSearch(query);
  };

  searchInput.addEventListener('input', function(e) {
    const query = e.target.value.trim().toLowerCase();
    performSearch(query);
  });

  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') window.handleSearch();
  });

  tabsHeader.addEventListener('keydown', function(e) {
    const buttons = Array.from(tabsHeader.querySelectorAll('.tab-button'));
    const currentIdx = buttons.findIndex(function(b) { return b.getAttribute('tabindex') === '0'; });
    if (currentIdx === -1) return;

    let nextIdx = currentIdx;
    if (e.key === 'ArrowRight') {
      nextIdx = (currentIdx + 1) % buttons.length;
    } else if (e.key === 'ArrowLeft') {
      nextIdx = (currentIdx - 1 + buttons.length) % buttons.length;
    } else if (e.key === 'Home') {
      nextIdx = 0;
    } else if (e.key === 'End') {
      nextIdx = buttons.length - 1;
    } else {
      return;
    }
    e.preventDefault();
    buttons[nextIdx].focus();
    switchTab(nextIdx);
  });

  function parseHash() {
    if (ignoreNextHashChange) return;
    var hash = decodeURIComponent(location.hash.slice(1));
    if (!hash) return;

    if (hash.indexOf('search=') === 0) {
      var query = hash.slice(7);
      searchInput.value = query;
      performSearch(query.toLowerCase());
      return;
    }

    var parts = hash.split('/');
    var islandName = parts[0];
    var dinoName = parts[1] || '';

    if (islandName === 'tracker') {
      _switchTab(ISLANDS.length);
      return;
    }

    var islandIdx = ISLANDS.indexOf(islandName);
    if (islandIdx === -1) {
      islandIdx = 0;
      islandName = ISLANDS[0];
    }
    currentIsland = islandName;

    if (dinoName) {
      var dino = DINOS[islandName] && DINOS[islandName].find(function(d) { return d.name === dinoName; });
      if (dino) {
        _switchTab(islandIdx);
        _showDinoDetail(dino);
        return;
      }
    }

    _switchTab(islandIdx);
  }

  window.addEventListener('hashchange', parseHash);

  function detectTV() {
    const ua = navigator.userAgent.toLowerCase();
    const isTVUA = /android.*tv|crkey|smart-tv|googletv|appletv|hbbtv|tizen|webos.+tv|vidaa|netcast|playstation|xbox/.test(ua);
    const isCoarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    const isNoPointer = window.matchMedia && window.matchMedia('(pointer: none)').matches;
    const isLargeScreen = window.screen && (window.screen.width >= 1280 || window.screen.height >= 720);
    const noTouch = !('ontouchstart' in window);
    return isTVUA || (isLargeScreen && noTouch && (isCoarsePointer || isNoPointer));
  }

  if (detectTV()) document.documentElement.classList.add('is-tv');

  renderTabs();
  updateSearchButton();

  parseHash();
})();
</script>
</body>
</html>
